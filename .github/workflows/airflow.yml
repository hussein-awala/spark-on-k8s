name: Airflow compatibility

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: airflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  airflow:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Airflow 3
            version: "3.4.0"
          - name: Airflow 2.11
            version: "2.11.2"
    env:
      AIRFLOW_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create isolated test environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow" >> "$GITHUB_ENV"
      - name: Install the Airflow extra and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[airflow]' "apache-airflow==$AIRFLOW_VERSION" pytest mock freezegun
      - name: Verify the requested Airflow integration
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          import airflow
          from airflow.providers.cncf.kubernetes.hooks.kubernetes import AsyncKubernetesHook, KubernetesHook
          from spark_on_k8s.airflow.operators import SparkOnK8SOperator, SparkSqlOnK8SOperator
          assert version("apache-airflow") == os.environ["AIRFLOW_VERSION"]
          assert airflow.__version__ == os.environ["AIRFLOW_VERSION"]
          print(f"Testing Airflow {airflow.__version__}")
          print(f"Kubernetes provider {version('apache-airflow-providers-cncf-kubernetes')}")
          PY
      - name: Run Airflow tests
        run: python -m pytest tests/airflow --junitxml=airflow-results.xml
      - name: Require executed tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("airflow-results.xml").iter("testcase"))
          assert cases, "No Airflow tests were collected"
          skipped = [case.attrib["name"] for case in cases if case.find("skipped") is not None]
          assert not skipped, f"Airflow tests were skipped: {skipped}"
          PY
