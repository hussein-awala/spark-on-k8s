name: test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

jobs:
  changed-files:
    runs-on: ubuntu-24.04
    outputs:
      should_run_pytest: ${{ steps.check-pytest.outputs.src }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: check-pytest
        name: Should run pytest
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - "spark_on_k8s/**"
              - "tests/**"
              - "chart/**"
              - "poetry.lock"
              - "pyproject.toml"
              - ".github/workflows/ci.yml"

  pytest:
    needs: changed-files
    if: ${{ needs.changed-files.outputs.should_run_pytest == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # The package requires Python 3.11 or newer.
        os: [ "ubuntu-24.04", "macos-15-intel" ]
        python-version: [ "3.11", "3.12", "3.13" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # Poetry 2.3+ requires Python 3.10 or newer.
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ matrix.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock', 'pyproject.toml') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --all-extras

      - name: Install library
        run: poetry install --no-interaction --all-extras

      - name: Install Helm for chart tests
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.17.3"

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ --cov spark_on_k8s --cov-report=json

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
