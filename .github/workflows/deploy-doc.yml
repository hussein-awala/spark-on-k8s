name: Deploy the documentation
on:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: write
  actions: read

concurrency:
  group: documentation-gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Qualify tagged documentation before publication
        id: tag_eligibility
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_eligibility.py \
            --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" \
            --version "$GITHUB_REF_NAME" --timeout-seconds 1800 \
            --output "$RUNNER_TEMP/docs-eligibility.json" --github-output "$GITHUB_OUTPUT"
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create documentation environment
        run: |
          unset CONDA_DEFAULT_ENV CONDA_PREFIX VIRTUAL_ENV
          uv python install 3.12
          python_path="$(uv python find --managed-python 3.12)"
          uv venv --python "$python_path" .venv
          .venv/bin/python - <<'PYTHON'
          import sys
          from pathlib import Path
          assert sys.prefix != sys.base_prefix, "Expected an isolated virtual environment"
          assert Path(sys.prefix).resolve() == Path(".venv").resolve(), sys.prefix
          PYTHON
          echo "CONDA_DEFAULT_ENV=" >> "$GITHUB_ENV"
          echo "CONDA_PREFIX=" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow" >> "$GITHUB_ENV"
      - name: Install documentation dependencies
        run: |
          uv lock --check
          uv sync --locked --no-default-groups --group docs --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs-${{ runner.os }}-${{ hashFiles('uv.lock', 'mkdocs.yml') }}
          path: .cache
      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages
      - name: Build Helm Docs
        run: .venv/bin/helm-mkdocs chart -o docs/helm-chart
      - name: Build versioned documentation locally
        env:
          PROMOTE_LATEST: ${{ steps.tag_eligibility.outputs.promote_latest }}
          IS_PRERELEASE: ${{ steps.tag_eligibility.outputs.prerelease }}
        run: |
          export DOCS_SOURCE_SHA="$(git rev-parse HEAD)"
          aliases=()
          options=()
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            export DOCS_VERSION=develop DOCS_CHANNEL=develop
            title="Development (unreleased)"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export DOCS_VERSION="$GITHUB_REF_NAME" DOCS_CHANNEL=release
            title="$DOCS_VERSION"
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              export DOCS_CHANNEL=prerelease
              title="$DOCS_VERSION (prerelease)"
            elif [[ "$PROMOTE_LATEST" == "true" ]]; then
              options=(--update-aliases)
              aliases=(latest)
            fi
          else
            echo "Not a deployable ref"
            exit 1
          fi
          # mkdocs.yml makes mike's single inner build strict. Do not push yet.
          .venv/bin/mike deploy --title "$title" \
            --prop-set-string "source_sha=$DOCS_SOURCE_SHA" \
            --prop-set-string "channel=$DOCS_CHANNEL" \
            "${options[@]}" "$DOCS_VERSION" "${aliases[@]}"
      - name: Check the generated pages before publication
        run: .venv/bin/python scripts/check_docs.py site
      - name: Preserve the checked documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
      - name: Publish checked documentation
        run: git push origin gh-pages:gh-pages
