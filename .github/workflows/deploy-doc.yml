name: Deploy the documentation
on:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: write
  actions: read

concurrency:
  group: documentation-gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Qualify tagged documentation before publication
        id: tag_eligibility
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_eligibility.py \
            --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" \
            --version "$GITHUB_REF_NAME" --timeout-seconds 1800 \
            --output "$RUNNER_TEMP/docs-eligibility.json" --github-output "$GITHUB_OUTPUT"
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create documentation environment
        run: |
          unset CONDA_DEFAULT_ENV CONDA_PREFIX VIRTUAL_ENV
          uv python install 3.12
          python_path="$(uv python find --managed-python 3.12)"
          uv venv --python "$python_path" .venv
          .venv/bin/python - <<'PYTHON'
          import sys
          from pathlib import Path
          assert sys.prefix != sys.base_prefix, "Expected an isolated virtual environment"
          assert Path(sys.prefix).resolve() == Path(".venv").resolve(), sys.prefix
          PYTHON
          echo "CONDA_DEFAULT_ENV=" >> "$GITHUB_ENV"
          echo "CONDA_PREFIX=" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow" >> "$GITHUB_ENV"
      - name: Install documentation dependencies
        run: |
          uv lock --check
          uv sync --locked --no-default-groups --group docs --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs-${{ runner.os }}-${{ hashFiles('uv.lock', 'mkdocs.yml') }}
          path: .cache
      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages:gh-pages
      - name: Build Helm Docs
        run: .venv/bin/helm-mkdocs chart -o docs/helm-chart
      - name: Deploy Docs
        env:
          PROMOTE_LATEST: ${{ steps.tag_eligibility.outputs.promote_latest }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            .venv/bin/mike deploy --push develop
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            if [[ "$PROMOTE_LATEST" == "true" ]]; then
              .venv/bin/mike deploy --push --update-aliases "$version" latest
            else
              .venv/bin/mike deploy --push "$version"
            fi
          else
            echo "Not a deployable ref"
            exit 1
          fi
