name: helm-release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Published spark-on-k8s API image version (bare X.Y.Z, 0.13.0 or newer)'
        required: true
      chart_version:
        description: 'New chart version (X.Y.Z); published versions are rejected'
        required: true

concurrency:
  group: helm-chart-gh-pages
  cancel-in-progress: false
  queue: max

jobs:
  helm-build-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The chart's default image tag is its appVersion: refuse an image that does not
      # exist yet or lacks /ready, and never replace an already published chart version.
      - name: Check release inputs and the published API image
        env:
          APP_VERSION: ${{ inputs.app_version }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          python3 scripts/chart_release.py --app-version "$APP_VERSION" --chart-version "$CHART_VERSION"
          docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY_OWNER/spark-on-k8s:$APP_VERSION"
      - name: Set explicit package metadata before publisher lint
        env:
          APP_VERSION: ${{ inputs.app_version }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          python - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          path = Path("chart/Chart.yaml")
          text = path.read_text()
          for key, variable in (("appVersion", "APP_VERSION"), ("version", "CHART_VERSION")):
              value = os.environ[variable]
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", value):
                  raise SystemExit(f"Invalid {variable}")
              text = re.sub(rf"^{key}:.*$", f'{key}: "{value}"', text, flags=re.MULTILINE)
          path.write_text(text)
          PYTHON
      - name: Publish Helm chart
        # Latest upstream commit; newer than the v1.7.0 release.
        uses: stefanprodan/helm-gh-pages@89c6698c192e70ed0e495bee7d3d1ca5b477fe82
        with:
          token: ${{ secrets.HELM_RELEASE_TOKEN }}
          charts_dir: .
          repository: spark-on-k8s-chart
          branch: gh-pages
          helm_version: 4.3.1
          app_version: ${{ github.event.inputs.app_version }}
          chart_version: ${{ github.event.inputs.chart_version }}
