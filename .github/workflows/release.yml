name: release

on:
  push:
    tags: ['*']
  pull_request:
    paths:
      - "docker/**"
      - "scripts/release*.py"
      - "tests/release/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/release.yml"
      - ".github/workflows/deploy-doc.yml"
  workflow_dispatch:
    inputs:
      version:
        description: 'Bare candidate version (X.Y.Z, optionally aN/bN/rcN); dry run only'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'release-publication' || format('release-validation-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.select.outputs.commit }}
      version: ${{ steps.select.outputs.version }}
      prerelease: ${{ steps.select.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Select a release or nonpublishing preview version
        id: select
        env:
          CANDIDATE_VERSION: ${{ github.event_name == 'pull_request' && '0.0.0rc1' || inputs.version || github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import runpy
          import subprocess
          validator = runpy.run_path('scripts/release_eligibility.py')['validate_version']
          version = os.environ['CANDIDATE_VERSION']
          prerelease = validator(version)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'commit={commit}\nversion={version}\nprerelease={str(prerelease).lower()}\n')
          PYTHON

  eligibility:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    needs: candidate
    if: github.event_name != 'pull_request'
    outputs:
      promote_latest: ${{ steps.check.outputs.promote_latest }}
      promote_minor: ${{ steps.check.outputs.promote_minor }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require executed checks for the exact candidate commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          python3 scripts/release_eligibility.py \
            --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" \
            --version "$CANDIDATE_VERSION" --timeout-seconds 1800 \
            --output release-evidence/eligibility.json --github-output "$GITHUB_OUTPUT"
      - name: Save qualification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-eligibility
          path: release-evidence/
          if-no-files-found: error

  python-release-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [candidate, eligibility]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (github.event_name == 'pull_request' || needs.eligibility.result == 'success') }}
    outputs:
      image_labels: ${{ steps.labels.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up build Python
        run: |
          unset CONDA_DEFAULT_ENV CONDA_PREFIX VIRTUAL_ENV
          uv python install 3.12
          python_path="$(uv python find --managed-python 3.12)"
          echo "UV_PYTHON=$python_path" >> "$GITHUB_ENV"
      - name: Freeze API dependencies, build and verify distributions
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          set -euo pipefail
          uv lock --check
          mkdir -p docker/release
          uv export --locked --no-default-groups --extra api --no-emit-project \
            --format requirements.txt --output-file docker/release/requirements.txt > /dev/null
          uv version --frozen "$RELEASE_VERSION"
          uv build
          python3 scripts/release_artifacts.py prepare --dist dist --lock uv.lock \
            --requirements docker/release/requirements.txt --dockerfile docker/Dockerfile \
            --output docker/release --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - name: Upload dists
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
      - name: Upload exact container build inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-container-inputs
          path: docker/
          if-no-files-found: error
      # Computed once so both architecture images carry identical labels.
      - name: Extract API image labels
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: latest=false
          tags: |
            type=sha
            type=pep440,pattern={{version}}

  # The image published by docker-release is the one exported and checked here, never a rebuild.
  container-check:
    name: Verify frozen API image (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: python-release-build
    if: ${{ !cancelled() && needs.python-release-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    services:
      # Job-local registry, so the checks pull the exported image by its digest.
      registry:
        image: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
        ports:
          - 5000:5000
    steps:
      # Only the release scripts; the image context is the frozen inputs artifact alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-container-inputs
          path: docker
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.python-release-build.outputs.image_labels }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          sbom: true
          provenance: mode=max
      - name: Check packaged API by digest and save installed inventory
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          digest="$(python3 scripts/release_image.py describe --archive "$RUNNER_TEMP/image.tar" \
            --architecture "$IMAGE_ARCH" --output release-evidence/image.json)"
          skopeo copy --all --preserve-digests --dest-tls-verify=false --digestfile "$RUNNER_TEMP/pushed.digest" \
            "oci-archive:$RUNNER_TEMP/image.tar" "docker://localhost:5000/spark-on-k8s:$IMAGE_ARCH"
          test "$(cat "$RUNNER_TEMP/pushed.digest")" = "$digest"
          image="localhost:5000/spark-on-k8s@$digest"
          docker run --rm --platform "linux/$IMAGE_ARCH" --entrypoint python "$image" \
            -c 'from spark_on_k8s.api.main import app; assert app is not None'
          # The chart's runAsUser/fsGroup defaults and run-history mount rely on this identity.
          docker run --rm --platform "linux/$IMAGE_ARCH" --entrypoint python "$image" -c \
            'import os; assert (os.getuid(), os.getgid()) == (10001, 10001); assert os.access("/var/lib/spark-on-k8s", os.W_OK)'
          docker create --name release-evidence --platform "linux/$IMAGE_ARCH" "$image"
          docker cp release-evidence:/opt/spark-on-k8s/release/installed.json release-evidence/installed.json
          docker rm release-evidence
          cp docker/release/manifest.json release-evidence/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installed-${{ matrix.arch }}
          path: release-evidence/
          if-no-files-found: error
      - name: Upload the checked image layout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          compression-level: 0

  container-image:
    name: Assemble the checked multi-arch image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: container-check
    if: ${{ !cancelled() && needs.container-check.result == 'success' }}
    outputs:
      digest: ${{ steps.assemble.outputs.digest }}
    services:
      registry:
        image: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-image-*
          path: release-checked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-installed-*
          path: release-checked
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Assemble the index from the checked digests and rehearse its push
        id: assemble
        run: |
          set -euo pipefail
          images=()
          for arch in amd64 arm64; do
            images+=(--image "$arch" "release-checked/release-image-$arch/image.tar" \
              "release-checked/release-installed-$arch/image.json")
          done
          digest="$(python3 scripts/release_image.py assemble "${images[@]}" \
            --output release-image/layout --summary release-image/image.json)"
          # The same copy that docker-release performs, into the job-local registry.
          skopeo copy --all --preserve-digests --dest-tls-verify=false --digestfile "$RUNNER_TEMP/pushed.digest" \
            oci:release-image/layout:release docker://localhost:5000/spark-on-k8s:release
          test "$(cat "$RUNNER_TEMP/pushed.digest")" = "$digest"
          for platform in amd64:x86_64 arm64:aarch64; do
            machine="$(docker run --rm --pull always --platform "linux/${platform%%:*}" --entrypoint python \
              "localhost:5000/spark-on-k8s@$digest" -c 'import platform; print(platform.machine())')"
            test "$machine" = "${platform#*:}"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: release-image/
          if-no-files-found: error
          compression-level: 0

  pypi-publish:
    runs-on: ubuntu-26.04
    needs: [python-release-build, container-check, container-image]
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/spark-on-k8s
    permissions:
      id-token: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  docker-release:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [candidate, eligibility, container-image, pypi-publish]
    if: github.event_name == 'push'
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-container-inputs
          path: docker
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: release-image
      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/spark-on-k8s
            husseinawala/spark-on-k8s
          flavor: latest=false
          tags: |
            type=sha
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}},enable=${{ needs.eligibility.outputs.promote_minor == 'true' }}
            type=raw,value=latest,enable=${{ needs.eligibility.outputs.promote_latest == 'true' }}
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the checked image without rebuilding
        id: push
        env:
          IMAGE_DIGEST: ${{ needs.container-image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Every tag receives the assembled layout unchanged; blobs already present are skipped.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests --retry-times 3 --digestfile "$RUNNER_TEMP/pushed.digest" \
              oci:release-image/layout:release "docker://$tag"
            test "$(cat "$RUNNER_TEMP/pushed.digest")" = "$IMAGE_DIGEST"
            test "sha256:$(skopeo inspect --raw --retry-times 3 "docker://$tag" | sha256sum | cut -d' ' -f1)" \
              = "$IMAGE_DIGEST"
          done <<< "$IMAGE_TAGS"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Record published image identity
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('docker/release/manifest.json').read_text())
          image = json.loads(Path('release-image/image.json').read_text())
          if image['digest'] != os.environ['IMAGE_DIGEST']:
              raise SystemExit('Pushed digest differs from the assembled image')
          manifest['image'] = {
              'digest': image['digest'],
              'tags': os.environ['IMAGE_TAGS'].splitlines(),
              'platforms': image['platforms'],
          }
          Path('release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-release-manifest
          path: release-manifest.json
          if-no-files-found: error

  # A separate job, so the steps that push image content never hold an OIDC token.
  image-sign:
    name: Sign the published image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: docker-release
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_DIGEST: ${{ needs.docker-release.outputs.digest }}
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/spark-on-k8s
      DOCKERHUB_IMAGE: docker.io/husseinawala/spark-on-k8s
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign the published digest in each registry
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # By digest, never by tag: a tag can move, the digest names the checked bytes.
          cosign sign --yes "$GHCR_IMAGE@$IMAGE_DIGEST" "$DOCKERHUB_IMAGE@$IMAGE_DIGEST"
      - name: Verify the signatures as a user would
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            # A registry can serve a just-pushed signature late (Docker Hub did for 0.13.0), so a
            # failed check is retried for about two minutes before it fails the release.
            for attempt in 1 2 3 4 5 6; do
              if cosign verify "$image@$IMAGE_DIGEST" \
                --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-github-workflow-sha "$GITHUB_SHA" > "release-evidence/${image%%/*}.json"; then
                break
              fi
              if [ "$attempt" = 6 ]; then
                echo "::error::No verifiable signature for $image@$IMAGE_DIGEST after $attempt attempts"
                exit 1
              fi
              echo "Signature for $image not verifiable yet (attempt $attempt); retrying in 20 seconds"
              sleep 20
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-signature
          path: release-evidence/
          if-no-files-found: error
