{{- if .Values.runHistory.enabled }}
{{- if or .Values.autoscaling.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "runHistory requires one replica with autoscaling disabled for SQLite persistence" }}
{{- end }}
{{- if not .Values.runHistory.namespaces }}
{{- fail "runHistory requires an explicit namespace list" }}
{{- end }}
{{- $_ := required "runHistory requires an existing persistent volume claim" .Values.runHistory.existingClaim }}
{{- range .Values.volumes }}
{{- if eq .name "run-history" }}{{- fail "run-history is a reserved volume name" }}{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spark-on-k8s.fullname" . }}
  labels:
    {{- include "spark-on-k8s.labels" . | nindent 4 }}
spec:
  {{- if .Values.runHistory.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "spark-on-k8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "spark-on-k8s.labels" . | nindent 8 }}
	{{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "spark-on-k8s.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "spark-on-k8s.image" (dict "image" .Values.image "defaultTag" .Chart.AppVersion "error" "API image requires image.tag, image.digest or Chart.appVersion") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $envNames := list }}
          {{- range .Values.env }}
          {{- $envNames = append $envNames .name }}
          {{- end }}
          env:
            {{- if not (has "SPARK_ON_K8S_IN_CLUSTER" $envNames) }}
            - name: SPARK_ON_K8S_IN_CLUSTER
              value: "true"
            {{- end }}
            {{- if not (has "SPARK_ON_K8S_API_HOST" $envNames) }}
            - name: SPARK_ON_K8S_API_HOST
              value: "0.0.0.0"
            {{- end }}
            {{- if not (has "SPARK_ON_K8S_API_PORT" $envNames) }}
            - name: SPARK_ON_K8S_API_PORT
              value: {{ .Values.service.port | quote }}
            {{- end }}
            {{- if and .Values.sparkHistory.enabled (not (has "SPARK_ON_K8S_API_SPARK_HISTORY_HOST" $envNames)) }}
            - name: SPARK_ON_K8S_API_SPARK_HISTORY_HOST
              value: "{{ include "spark-on-k8s.sparkHistory.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.sparkHistory.service.port }}"
            {{- end }}
            {{- if not (has "SPARK_ON_K8S_API_DEFAULT_NAMESPACE" $envNames) }}
            {{- if .Values.runHistory.enabled }}
            - name: SPARK_ON_K8S_API_DEFAULT_NAMESPACE
              value: {{ first .Values.runHistory.namespaces | quote }}
            {{- else if ne .Values.namespaces "*" }}
            - name: SPARK_ON_K8S_API_DEFAULT_NAMESPACE
              value: {{ first (splitList "," .Values.namespaces) | trim | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.runHistory.enabled }}
            {{- $historyEnv := dict "SPARK_ON_K8S_RUN_HISTORY_ENABLED" "true" "SPARK_ON_K8S_RUN_HISTORY_PATH" "/var/lib/spark-on-k8s/runs.sqlite3" "SPARK_ON_K8S_RUN_HISTORY_NAMESPACES" (join "," .Values.runHistory.namespaces) "SPARK_ON_K8S_RUN_HISTORY_INTERVAL" (.Values.runHistory.intervalSeconds | toString) "SPARK_ON_K8S_RUN_HISTORY_RETENTION_DAYS" (.Values.runHistory.retentionDays | toString) "SPARK_ON_K8S_RUN_HISTORY_MAX_ROWS" (.Values.runHistory.maxRows | toString) }}
            {{- range $name, $value := $historyEnv }}
            {{- if not (has $name $envNames) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if and .Values.metrics.enabled (not (has "SPARK_ON_K8S_METRICS_ENABLED" $envNames)) }}
            - name: SPARK_ON_K8S_METRICS_ENABLED
              value: "true"
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.runHistory.enabled .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.runHistory.enabled }}
            - name: run-history
              mountPath: /var/lib/spark-on-k8s
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.runHistory.enabled .Values.volumes }}
      volumes:
        {{- if .Values.runHistory.enabled }}
        - name: run-history
          persistentVolumeClaim:
            claimName: {{ .Values.runHistory.existingClaim | quote }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
