{{- $rootContext := . }}
{{- $values := .Values }}
{{- $release := .Release }}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spark-on-k8s.serviceAccountName" . }}
  labels:
    {{- include "spark-on-k8s.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- if eq (include "spark-on-k8s.rbacCreate" .) "true" }}
{{- $scope := include "spark-on-k8s.namespaces" . }}
{{- if eq $scope "*" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "spark-on-k8s.rbacName" . }}
  labels:
    {{- include "spark-on-k8s.labels" . | nindent 4 }}
rules:
  {{- include "spark-on-k8s.rbacRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  {{- /* Earlier -view/-edit bindings referenced built-in roles; roleRef is immutable. */}}
  name: {{ include "spark-on-k8s.rbacName" . }}
  labels:
    {{- include "spark-on-k8s.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spark-on-k8s.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "spark-on-k8s.rbacName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- else }}
{{- range $namespace := (splitList "," $scope) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "spark-on-k8s.rbacName" $rootContext }}
  namespace: {{ $namespace }}
  labels:
    {{- include "spark-on-k8s.labels" $rootContext | nindent 4 }}
rules:
  {{- include "spark-on-k8s.rbacRules" $rootContext | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- if $values.readOnly }}
  name: {{ include "spark-on-k8s.rbacName" $rootContext }}-view
  {{- else }}
  name: {{ include "spark-on-k8s.rbacName" $rootContext }}-edit
  {{- end }}
  namespace: {{ $namespace }}
  labels:
    {{- include "spark-on-k8s.labels" $rootContext | nindent 4 }}
subjects:
    - kind: ServiceAccount
      name: {{ include "spark-on-k8s.serviceAccountName" $rootContext }}
      namespace: {{ $release.Namespace }}
roleRef:
    kind: Role
    name: {{ include "spark-on-k8s.rbacName" $rootContext }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}