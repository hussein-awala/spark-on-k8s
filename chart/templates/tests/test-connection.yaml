apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "spark-on-k8s.fullname" . }}-test-connection"
  labels:
    {{- include "spark-on-k8s.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O', '/dev/null', 'http://{{ include "spark-on-k8s.fullname" . }}:{{ .Values.service.port }}/ready']
  restartPolicy: Never
