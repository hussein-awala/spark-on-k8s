# Number of replicas for the Spark-on-K8S deployment if autoscaling is disabled
replicaCount: 1

# API worker processes in each pod (1-64), set as SPARK_ON_K8S_API_WORKERS. null keeps the
# image default (4 in the published image). Each worker is a separate process with its own
# memory and connection limit; size resources accordingly. An env entry takes precedence.
workers: null

# Docker image configuration for the Spark-on-K8S deployment
image:
  # The Docker image repository
  repository: ghcr.io/hussein-awala/spark-on-k8s
  # The deployment docker image pull policy
  pullPolicy: IfNotPresent
  # Source previews require an explicit compatible image tag or digest.
  # Published packages use their qualified appVersion when this is empty.
  tag: ""
  # Optional sha256 digest; takes precedence over tag and Chart.appVersion.
  digest: ""

# List of imagePullSecrets to be used
imagePullSecrets: []

# Override the chart name in the release resources
nameOverride: ""

# Override the fullname of the release resources
fullnameOverride: ""

# The service account configuration for the Spark-on-K8S deployment
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Specifies whether the service account token should be auto mounted
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

# RBAC ownership is independent of service-account ownership.
rbac:
  # null preserves legacy behavior: follow serviceAccount.create.
  # true manages roles/bindings even for an existing named account; false manages none.
  create: null
  # Preserve old shared RBAC names only for an existing installation.
  legacyNames: false

# Annotations to be added to the Spark-on-K8S deployment pods
podAnnotations: {}

# Labels to be added to the Spark-on-K8S deployment pods
podLabels: {}

# The pod security context for the Spark-on-K8S deployment. The defaults meet Pod Security
# "restricted" for the API image's non-root user; set a key to null to remove it.
podSecurityContext:
  # Refuse to start the API as root
  runAsNonRoot: true
  # The API image's numeric user
  runAsUser: 10001
  # The API image's numeric group
  runAsGroup: 10001
  # Group given access to mounted volumes, including an existing run-history claim
  fsGroup: 10001
  # Change volume ownership only when the volume root does not already match fsGroup
  fsGroupChangePolicy: OnRootMismatch
  # The container runtime's default seccomp profile
  seccompProfile:
    type: RuntimeDefault

# The security context for the Spark-on-K8S deployment container
securityContext:
  # Block setuid and other privilege gains
  allowPrivilegeEscalation: false
  # The API needs no Linux capabilities
  capabilities:
    drop:
      - ALL

# The configuration for the Spark-on-K8S service
service:
  # The type of service to create
  type: ClusterIP
  # The port to expose the service on
  port: 8000

# The configuration for the Spark-on-K8S ingress
ingress:
  # Specifies whether an ingress should be created
  enabled: false
  # The ingress class to use
  className: ""
  # The list of ingress annotations
  annotations: {}
  # The list of hosts to be added to the ingress
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # The list of tls to be added to the ingress
  tls: []

# The resource configuration for the Spark-on-K8S deployment
resources: {}

# The autoscaling configuration for the Spark-on-K8S deployment
autoscaling:
  # Specifies whether autoscaling should be enabled
  enabled: false
  # The minimum number of replicas
  minReplicas: 1
  # The maximum number of replicas
  maxReplicas: 100
  # The target CPU utilization percentage
  targetCPUUtilizationPercentage: 80

# The list of volumes to be added to the Spark-on-K8S deployment pods
volumes: []

# The list of volume mounts to be added to the Spark-on-K8S deployment pods
volumeMounts: []

# The node selector for the Spark-on-K8S deployment
nodeSelector: {}

# The tolerations for the Spark-on-K8S deployment
tolerations: []

# The affinity for the Spark-on-K8S deployment
affinity: {}

# A list of environment variables to be added to the Spark-on-K8S deployment.
# Entries override the chart defaults for in-cluster authentication, API host
# (0.0.0.0), API port (service.port), and the optional history server address.
env: []

# Namespaces the Spark-on-K8S API serves and, with chart-managed RBAC, can access.
# Empty (the default) selects only the release namespace, with a Role and RoleBinding
# there. "*" selects every namespace, with a cluster role binding. A comma-separated
# string such as "namespace1,namespace2" selects those namespaces, with a Role and
# RoleBinding in each. The API refuses other namespaces, including in its Spark UI
# proxy and log streams.
namespaces: ""

# If true, the Spark-on-K8S service will be able to read pods, services, pods logs,
# and if false, it will be able to exec into pods and create/delete pods and services.
readOnly: true

# Configuration for the Spark History Server
sparkHistory:
    # Specifies whether the Spark History Server should be enabled
    enabled: false
    # The number of replicas for the Spark History Server if autoscaling is disabled
    replicaCount: 1
    # The autoscaling configuration for the Spark History Server
    autoscaling:
      # Specifies whether autoscaling should be enabled
      enabled: false
      # The minimum number of replicas
      minReplicas: 1
      # The maximum number of replicas
      maxReplicas: 100
      # The target CPU utilization percentage
      targetCPUUtilizationPercentage: 80
    # Docker image configuration for the Spark History Server
    image:
      # The Docker image repository
      repository: ghcr.io/hussein-awala/spark-history
      # The deployment docker image pull policy
      pullPolicy: IfNotPresent
      # Required when enabled unless digest is set; this image has a separate release lifecycle.
      tag: ""
      # Optional immutable sha256 digest; takes precedence over tag.
      digest: ""
    # A list of environment variables to be added to the Spark History Server container
    env: []
    # The resource configuration for the Spark History Server
    resources: {}
    # A list of volume mounts to be added to the Spark History Server pods
    volumeMounts: []
    # A list of volumes to be added to the Spark History Server pods
    volumes: []
    # Annotations to be added to the Spark History Server pods
    podAnnotations: {}
    # Labels to be added to the Spark History Server pods
    podLabels: {}
    # The pod security context for the Spark History Server
    podSecurityContext: {}
    # The security context for the Spark History Server
    securityContext: {}
    # The service account configuration for the Spark History Server
    serviceAccount:
        # Specifies whether a service account should be created
        create: true
        # Specifies whether the service account token should be auto mounted
        automount: true
        # Annotations to add to the service account
        annotations: {}
        # The name of the service account to use.
        name: ""
    # The configuration for the Spark History Server service
    service:
        # The type of service to create
        type: ClusterIP
        # The port to expose the service on
        port: 18080
    # The node selector for the Spark History Server pods
    nodeSelector: {}
    # The affinity for the Spark History Server pods
    affinity: {}
    # The tolerations for the Spark History Server pods
    tolerations: []
    # The Spark configuration for the Spark History Server
    configuration: ""
    # Readiness probe on the History Server UI port; null removes it. To use another handler,
    # also set httpGet to null.
    readinessProbe:
      httpGet:
        path: /api/v1/version
        port: 18080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    # Liveness probe on the History Server UI port; null removes it. It allows two minutes of
    # failures so slow event-log scans and garbage-collection pauses do not restart the server.
    livenessProbe:
      httpGet:
        path: /api/v1/version
        port: 18080
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6
    # PodDisruptionBudget for the History Server pods; same rules as podDisruptionBudget
    podDisruptionBudget:
      # Specifies whether the budget should be created
      enabled: false
      # Pods that must stay available, as a number or percentage; set this or maxUnavailable
      minAvailable: null
      # Pods that may be unavailable, as a number or percentage; 1 when both are null
      maxUnavailable: null
    # NetworkPolicy for the History Server pods; their egress, such as to event-log storage,
    # stays unrestricted
    networkPolicy:
      # Admit only the API pods and ingress.from to the History Server port
      enabled: false
      ingress:
        # Additional NetworkPolicy peers allowed to reach the History Server port
        from: []

# Optional operational metadata recorder; separate from Spark History Server event logs.
runHistory:
  # Requires replicaCount 1, autoscaling disabled, namespaces and existingClaim.
  enabled: false
  # Explicit namespaces; the API service account must be able to list driver pods in each.
  namespaces: []
  # Existing ReadWriteOnce block-backed claim. SQLite WAL must not use NFS/SMB.
  existingClaim: ""
  # Seconds between driver-pod collection passes (5-3600)
  intervalSeconds: 30
  # Days to retain recorded runs (1-3650)
  retentionDays: 30
  # Maximum number of retained run records (1-1000000)
  maxRows: 10000

# Prometheus text endpoint; remote mode requires the same operator bearer token.
metrics:
  # Serve /metrics from the API
  enabled: false
  # Prometheus Operator ServiceMonitor that scrapes the API's /metrics
  serviceMonitor:
    # Requires metrics.enabled and the monitoring.coreos.com/v1 ServiceMonitor API; rendering
    # fails when that API is missing. For helm template, pass the API with --api-versions
    # monitoring.coreos.com/v1/ServiceMonitor. With remote.enabled, Prometheus authenticates
    # with the remote token Secret, so Prometheus holds the full operator credential.
    enabled: false
    # Scrape interval, such as 30s; empty uses the Prometheus default
    interval: ""
    # Scrape timeout, such as 10s; empty uses the Prometheus default
    scrapeTimeout: ""
    # Labels that your Prometheus serviceMonitorSelector requires, such as release: prometheus
    labels: {}

# Remote job submission. Enabling it also requires the operator bearer token on every API
# route except /health and /ready. The token is one shared operator credential, not tenant
# isolation; submissions also need write RBAC (readOnly: false or external grants).
remote:
  # Set SPARK_ON_K8S_SUBMISSION_* and mount the token and policy files read-only
  enabled: false
  # Existing Secret in the release namespace with both keys; the chart never creates it
  existingSecret: ""
  # Secret key holding the bearer token (32-4096 printable ASCII characters, no spaces)
  tokenKey: token
  # Secret key holding the submission policy JSON document
  policyKey: policy.json
  # Directory where the token and policy files are mounted
  mountPath: /etc/spark-on-k8s/remote

# PodDisruptionBudget for the API pods. A budget that permits no voluntary disruption, such as
# minAvailable 1 with one replica, fails rendering because it blocks node drains.
podDisruptionBudget:
  # Specifies whether the budget should be created
  enabled: false
  # Pods that must stay available, as a number or percentage; set this or maxUnavailable
  minAvailable: null
  # Pods that may be unavailable, as a number or percentage; 1 when both are null
  maxUnavailable: null

# NetworkPolicy for the API pods. It takes effect only with a network plugin that enforces
# NetworkPolicy; other plugins accept the object and ignore it.
networkPolicy:
  # Admit only ingress.from and this release's own pods to the API port
  enabled: false
  ingress:
    # NetworkPolicy peers allowed to reach the API port, such as the ingress controller,
    # gateway, clients and Prometheus. Empty admits only this release's pods, including its
    # helm test pod.
    from: []
  egress:
    # Also restrict API egress to DNS, the Kubernetes API, Spark driver UIs (port 4040) in the
    # API's namespaces, the History Server, this release's pods and extraRules
    enabled: false
    kubernetesApi:
      # Peers for the Kubernetes API server, normally ipBlock CIDRs of the endpoints of the
      # default/kubernetes Service. Empty allows no API server access through this policy.
      to: []
      # API server ports; most plugins match the endpoint port after Service translation
      ports:
        - 443
        - 6443
    dns:
      # Peers for DNS on port 53; empty allows port 53 to any destination
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # Additional NetworkPolicy egress rules, such as a cluster selected by SPARK_ON_K8S_CONFIG_FILE
    extraRules: []
