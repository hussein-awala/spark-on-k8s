site_name: Spark on Kubernetes
site_url: https://hussein.awala.fr/spark-on-k8s/
strict: true
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn
site_description: Submit, observe and troubleshoot Spark jobs on Kubernetes with Python, the CLI and Airflow.
site_author: hussein-awala
repo_url: https://github.com/hussein-awala/spark-on-k8s
repo_name: hussein-awala/spark-on-k8s
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: overrides
  font:
    text: Fira Sans
    code: Fira Code
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - content.action.edit
    - content.tooltips
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
    - search.suggest
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.follow
watch:
  - spark_on_k8s
plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
        - docs/gen_jupyter_examples.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
  - git-revision-date-localized:
      fallback_to_build_date: true
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Get started:
      - Choose your path: user-guide/start-here.md
      - When to use it: user-guide/when-to-use.md
      - Install: user-guide/installation.md
      - Your first Kubernetes job: user-guide/getting_started.md
      - Supported Spark runtimes: user-guide/spark_compatibility.md
  - Guides:
      - Run applications:
          - Portable job files: user-guide/jobs.md
          - SQL jobs: user-guide/sql.md
          - Driver pod templates: user-guide/driver_pod_templates.md
          - Application examples: user-guide/examples.md
          - ETL and lakehouse starters: user-guide/starters.md
      - Integrate and automate:
          - CLI automation and recovery: user-guide/automation.md
          - Spark Connect: user-guide/spark_connect.md
          - Connect server setup: user-guide/spark_connect_server.md
          - ML image for Connect: user-guide/connect_ml_image.md
          - Jupyter notebooks: user-guide/jupyter.md
          - Experimental managed dbt: user-guide/dbt.md
          - Airflow: user-guide/airflow.md
          - Upgrade Airflow DAGs from 0.12: user-guide/airflow-upgrade.md
          - Remote submission: user-guide/remote-submission.md
  - Operate:
      - Diagnose failures: user-guide/diagnostics.md
      - Run history and health: user-guide/run-history.md
      - Deploy the chart: user-guide/chart-deployments.md
      - Browser and gateway boundaries: security-boundaries.md
      - Operational boundaries: user-guide/operations.md
      - Support and compatibility: user-guide/support.md
      - Interface stability and 1.0: user-guide/stability.md
  - Reference:
      - Python API: reference/
      - Helm values: helm-chart/
  - Release notes: https://hussein.awala.fr/spark-on-k8s/release-notes/
  - Contributing:
      - Development and testing: development.md
      - Releases: releases.md
      - Review decisions: review-decisions.md
extra:
  documentation:
    channel: !ENV [DOCS_CHANNEL, local]
    version: !ENV [DOCS_VERSION, local]
    source_sha: !ENV [DOCS_SOURCE_SHA, ""]
  version:
    provider: mike
    default:
      - latest
      - develop
