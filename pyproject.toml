[project]
name = "spark-on-k8s"
version = "0.11.0-dev"
description = "A Python package to submit and manage Apache Spark applications on Kubernetes."
authors = [{name = "Hussein Awala", email = "hussein@awala.fr"}]
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["spark", "kubernetes", "k8s", "spark-submit", "spark-on-k8s"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    # Keep the synchronous client compatible with the Airflow Kubernetes provider.
    "kubernetes>=36.0.3,<37",
    "click>=8.5.1,<9",
    "pyyaml>=6.0.3,<7",
]

[project.urls]
Repository = "https://github.com/hussein-awala/spark-on-k8s"
"Bug Tracker" = "https://github.com/hussein-awala/spark-on-k8s/issues"
Documentation = "https://hussein.awala.fr/spark-on-k8s/"

[project.optional-dependencies]
sql = ["sqlparse>=0.6.1,<0.7"]
# Thin client only; a JVM and Spark server are supplied by the existing endpoint.
connect = [
    "pyspark-client>=4.0.5,<5; python_version < '3.15'",
    # Spark Connect does not yet fully support pandas 3; pandas 2 has no Python 3.15 wheels.
    "pandas>=2.2,<3; python_version < '3.15'",
]
api = [
    "fastapi>=0.162.1,<0.163",
    "starlette>=1.10.0,<2",
    "kubernetes-asyncio>=36.1.0,<37",
    "uvicorn>=0.54.0,<0.55",
    "httpx>=0.28.1,<0.29",
    "jinja2>=3.1.6,<4",
    "aiohttp>=3.14.5,<4",
    "websockets>=17.4,<18",
]
airflow = [
    "kubernetes-asyncio>=36.1.0,<37; python_version < '3.15'",
    "apache-airflow>=2.11.2,<4; python_version < '3.15'",
    "apache-airflow-providers-cncf-kubernetes>=10.25.0,<11; python_version < '3.15'",
    "sqlparse>=0.6.1,<0.7; python_version < '3.15'",
]

# Complete installation for the native Airflow task tab; the legacy extra stays compatible with 2.11.
airflow-ui = [
    "kubernetes-asyncio>=36.1.0,<37; python_version < '3.15'",
    "apache-airflow>=3.4.0,<4; python_version < '3.15'",
    "apache-airflow-providers-cncf-kubernetes>=10.25.0,<11; python_version < '3.15'",
    "sqlparse>=0.6.1,<0.7; python_version < '3.15'",
    "fastapi>=0.162.1,<0.163; python_version < '3.15'",
    "httpx>=0.28.1,<0.29; python_version < '3.15'",
    "websockets>=17.4,<18; python_version < '3.15'",
]

[project.scripts]
spark-on-k8s = "spark_on_k8s.cli:main"

[project.entry-points.apache_airflow_provider]
provider_info = "spark_on_k8s.airflow.provider_info:get_provider_info"

# Entrypoint loading also works with Airflow's default lazy provider discovery.
[project.entry-points."airflow.plugins"]
spark_on_k8s_ui = "spark_on_k8s.airflow.ui.plugin:SparkTaskUIPlugin"

[dependency-groups]
# Execute the published Jupyter notebook against the installed Connect client.
notebook = [
    "ipykernel>=7.4.0,<8",
    "nbclient>=0.11.0,<0.12",
    "nbformat>=5.10.4,<6",
    "psutil>=7.2.2,<8",
]
test = [
    "mock>=5.2.0,<6",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "freezegun>=1.5.5,<2",
]
lint = [
    "pre-commit>=4.7.0,<5",
    "ruff==0.17.4",
    "sqlfluff==4.5.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material>=9.8.0,<10",
    "mkdocstrings[python]>=1.0.8,<2",
    "mkdocs-gen-files>=0.6.1,<0.7",
    "mkdocs-literate-nav>=0.6.3,<0.7",
    "mkdocs-git-revision-date-localized-plugin>=1.6.3,<2",
    "helm-mkdocs>=0.0.5,<0.0.6",
    "mike>=2.2.0,<3",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["test"]

# Match the Connect extra's supported client Python range.
[tool.uv.dependency-groups]
notebook = {requires-python = ">=3.11,<3.15"}

[tool.uv.build-backend]
module-name = "spark_on_k8s"
module-root = ""
# Ship editable UI sources in sdists; wheels only need the prebuilt package assets.
source-include = ["frontend/src/**", "frontend/tests/**", "frontend/*.json", "frontend/*.ts"]

[tool.coverage.run]
patch = ["subprocess"]

[tool.coverage.paths]
source = ["spark_on_k8s", "*/site-packages/spark_on_k8s"]

[tool.ruff]
target-version = "py311"
line-length = 110
indent-width = 4
src = ["spark_on_k8s", "tests"]
[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["E712"]
select = [
    "E", # pycodestyle
    "W", # pycodestyle
    "F", # Pyflakes
    "B", # flake8-bugbear
    "PIE", # flake8-pie
    "C4", # flake8-comprehensions
    "I", # isort
    "UP", # pyupgrade,
    "TC", # flake8-type-checking
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.ruff.format]
# MkDocs uses snippet directives inside Python fences; keep those intact.
exclude = ["*.md"]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.sqlfluff.core]
dialect = "sparksql"
sql_file_exts = ".sql"
ignore = "templating"
exclude_rules="AL01"

[tool.sqlfluff.indentation]
indented_joins = false
indented_using_on = true
template_blocks_indent = false

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"
