[project]
name = "spark-on-k8s"
version = "0.11.0-dev"
description = "A Python package to submit and manage Apache Spark applications on Kubernetes."
authors = [{name = "Hussein Awala", email = "hussein@awala.fr"}]
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["spark", "kubernetes", "k8s", "spark-submit", "spark-on-k8s"]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    # Keep the synchronous client compatible with the Airflow Kubernetes provider.
    "kubernetes>=36.0.3,<37",
    "click>=8.5.1,<9",
    "pyyaml>=6.0.3,<7",
]

[project.urls]
Repository = "https://github.com/hussein-awala/spark-on-k8s"
"Bug Tracker" = "https://github.com/hussein-awala/spark-on-k8s/issues"
Documentation = "https://hussein.awala.fr/spark-on-k8s/"

[project.optional-dependencies]
api = [
    "fastapi>=0.162.1,<0.163",
    "starlette>=1.10.0,<2",
    "kubernetes-asyncio>=36.1.0,<37",
    "uvicorn>=0.54.0,<0.55",
    "httpx>=0.28.1,<0.29",
    "jinja2>=3.1.6,<4",
    "aiohttp>=3.14.5,<4",
    "websockets>=17.4,<18",
]
airflow = [
    "kubernetes-asyncio>=36.1.0,<37; python_version < '3.15'",
    "apache-airflow>=2.11.2,<4; python_version < '3.15'",
    "apache-airflow-providers-cncf-kubernetes>=10.25.0,<11; python_version < '3.15'",
    "sqlparse>=0.6.1,<0.7; python_version < '3.15'",
]

[project.scripts]
spark-on-k8s = "spark_on_k8s:cli.main"

[project.entry-points.apache_airflow_provider]
provider_info = "spark_on_k8s.airflow.provider_info:get_provider_info"

[tool.poetry]
packages = [{include = "spark_on_k8s"}]

[tool.poetry.group.test.dependencies]
mock = "^5.2.0"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
freezegun = "^1.5.5"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
pre-commit = "^4.7.0"
ruff = "==0.17.4"
sqlfluff = "==4.5.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "==1.6.1"
mkdocs-material = "^9.8.0"
mkdocstrings = {version = "^1.0.8", extras = ["python"]}
mkdocs-gen-files = "^0.6.1"
mkdocs-literate-nav = "^0.6.3"
mkdocs-git-revision-date-localized-plugin = "^1.6.3"
helm-mkdocs = "^0.0.5"
mike = "^2.2.0"

[build-system]
requires = ["poetry-core>=2.5.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff]
target-version = "py311"
line-length = 110
indent-width = 4
src = ["spark_on_k8s", "tests"]
[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["E712"]
select = [
    "E", # pycodestyle
    "W", # pycodestyle
    "F", # Pyflakes
    "B", # flake8-bugbear
    "PIE", # flake8-pie
    "C4", # flake8-comprehensions
    "I", # isort
    "UP", # pyupgrade,
    "TC", # flake8-type-checking
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.ruff.format]
# MkDocs uses snippet directives inside Python fences; keep those intact.
exclude = ["*.md"]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.sqlfluff.core]
dialect = "sparksql"
sql_file_exts = ".sql"
ignore = "templating"
exclude_rules="AL01"

[tool.sqlfluff.indentation]
indented_joins = false
indented_using_on = true
template_blocks_indent = false

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"
