# Values of an existing installation of the published chart that upgrade.sh upgrades.
# Chart 0.3.0 sets no API host or in-cluster flag unless the History Server is enabled,
# and its API 0.6.0 image otherwise listens on 127.0.0.1 and reads a kubeconfig file,
# so a working installation sets both here. The source chart sets them by default.
env:
  - name: SPARK_ON_K8S_API_HOST
    value: 0.0.0.0
  - name: SPARK_ON_K8S_IN_CLUSTER
    value: "true"
  # The 0.6.0 example values chose a default namespace; the source API's readiness
  # check lists driver pods there.
  - name: SPARK_ON_K8S_API_DEFAULT_NAMESPACE
    value: analytics
